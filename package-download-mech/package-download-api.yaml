openapi: 3.0.0
info:
  title: Package Download GraphQL API
  version: 1.0.0
  description: API for fetching eligible OTA packages and downloading them.
servers:
  - url: http://localhost:4000/package-download
    description: Local development server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    EligiblePackageResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message of the request.
        ecuPackageDetail:
          $ref: '#/components/schemas/EcuPackageDetail'
    EcuPackageDetail:
      type: object
      properties:
        packageId:
          type: string
          description: Unique identifier for the package.
        packageName:
          type: string
          description: Name of the package.
        fileName:
          type: string
          description: Name of the file.
        model:
          type: string
          description: Model of the vehicle.
        ecuName:
          type: string
          description: Name of the ECU.
        packageType:
          type: integer
          description: Type of the package.
        targetVersion:
          type: string
          description: Target version of the package.
        sourceVersion:
          type: string
          description: Source version of the package.
        partNumber:
          type: string
          description: Part number of the package.
        updateType:
          type: string
          description: Type of update.
        checksum:
          type: string
          description: Checksum of the package.
        partCode:
          type: string
          description: Part code of the package.
        hardwareVersion:
          type: string
          description: Hardware version of the package.
        planTime:
          type: string
          description: Plan time of the package.
    DownloadPackageResponse:
      type: object
      properties:
        message:
          type: string
          description: Status message of the request.
        packageInfo:
          $ref: '#/components/schemas/PackageInfo'
    PackageInfo:
      type: object
      properties:
        downloadUrl:
          type: string
          description: URL to download the package.
        security:
          $ref: '#/components/schemas/SecurityInfo'
    SecurityInfo:
      type: object
      properties:
        signature:
          type: string
          description: Signature for security.
        certificate:
          type: string
          description: Certificate for security.

paths:
  /package-download:
    post:
      summary: GraphQL endpoint for package download
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: GraphQL query
              example:
                query: |
                  query {
                    getEligiblePackage(systemId: "your_system_id") {
                      message
                      ecuPackageDetail {
                        packageId
                        packageName
                        fileName
                        model
                        ecuName
                        packageType
                        targetVersion
                        sourceVersion
                        partNumber
                        updateType
                        checksum
                        partCode
                        hardwareVersion
                        planTime
                      }
                    }
                  }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: GraphQL response object.
                properties:
                  data:
                    type: object
                    description: The result of the GraphQL query.
                  errors:
                    type: array
                    items:
                      type: object
                      description: Errors that occurred during the query execution.